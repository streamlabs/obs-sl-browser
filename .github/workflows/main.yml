name: 'CI Build'

on:
  workflow_dispatch:

env:
  SL_OBS_VERSION: ${{ github.ref_name }}
  GRPC_VERSION: v1.58.0
  AWS_SYMB_ACCESS_KEY_ID: ${{secrets.AWS_SYMB_ACCESS_KEY_ID}}
  AWS_SYMB_SECRET_ACCESS_KEY: ${{secrets.AWS_SYMB_SECRET_ACCESS_KEY}}
  AWS_RELEASE_ACCESS_KEY_ID: ${{secrets.AWS_RELEASE_ACCESS_KEY_ID}}
  AWS_RELEASE_SECRET_ACCESS_KEY: ${{secrets.AWS_RELEASE_SECRET_ACCESS_KEY}}
  RELEASE_BUCKET: "slobs-cdn.streamlabs.com/obsplugin/intermediary_packages/"

jobs:
  win64:
    name: 'Windows ${{ matrix.architecture }}'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        architecture: [x64, arm64]
        ReleaseName: [release]
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
          - ReleaseName: release
            ReleaseConfig: RelWithDebInfo
    env:
      OS_TAG: "win64"
    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.28.x'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build script
        run: powershell -File ./ci/pipeline.ps1 "${{ github.workspace }}" "${{ github.sha }}" "${{ matrix.architecture }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned_dir-${{ matrix.architecture }}
          path: ${{ github.workspace }}/unsigned_dir

  sign_binaries:
    name: 'Sign Binaries (${{ matrix.architecture }})'
    runs-on: signing
    environment: Release
    needs: [win64]
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: unsigned_dir-${{ matrix.architecture }}
          path: archive

      - name: List files
        run: |
          Get-ChildItem -Force -Recurse

      - name: Sign binaries
        run: |
          Get-ChildItem -Path archive -Recurse -File | Where-Object { @(".exe", ".dll") -contains $_.Extension } | ForEach-Object { logisign client --client logitech-cpg-sign-client --app streamlabs --files $_.FullName }

      - name: Upload Signed Dir
        uses: actions/upload-artifact@v4
        with:
          name: signed_dir-${{ matrix.architecture }}
          path: archive

  package:
    name: 'Package Installer (${{ matrix.architecture }})'
    runs-on: windows-2022
    needs: [sign_binaries]
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NSIS
        run: choco install nsis -y

      - name: Download Signed Dir
        uses: actions/download-artifact@v4
        with:
          name: signed_dir-${{ matrix.architecture }}
          path: archive

      - name: Clean files
        run: |
          Get-ChildItem -Path archive -Recurse -File | Where-Object { -not @(".exe", ".dll", ".png") -contains $_.Extension } | Remove-Item -Force

      - name: Upload Cleaned Archive
        uses: actions/upload-artifact@v4
        with:
          name: cleaned_archive-${{ matrix.architecture }}
          path: archive

      - name: Make installer
        shell: powershell
        run: ./ci/make_installer.ps1 "${{ env.SL_OBS_VERSION }}" "${{ github.sha }}"

      - name: Rename installer for arm64
        if: matrix.architecture == 'arm64'
        shell: powershell
        run: |
          Rename-Item "slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}-signed.exe" "slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}-arm64-signed.exe"

      - name: Upload Unsigned Installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned_installer-${{ matrix.architecture }}
          path: slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}${{ matrix.architecture == 'arm64' && '-arm64' || '' }}-signed.exe

  sign_installer:
    name: 'Sign Installer (${{ matrix.architecture }})'
    runs-on: signing
    environment: Release
    needs: [package]
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Download Unsigned Installer
        uses: actions/download-artifact@v4
        with:
          name: unsigned_installer-${{ matrix.architecture }}
          path: .

      - name: Sign installer
        run: |
          logisign client --client logitech-cpg-sign-client --app streamlabs --files slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}${{ matrix.architecture == 'arm64' && '-arm64' || '' }}-signed.exe

      - name: Upload Signed Installer
        uses: actions/upload-artifact@v4
        with:
          name: signed_installer-${{ matrix.architecture }}
          path: slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}${{ matrix.architecture == 'arm64' && '-arm64' || '' }}-signed.exe

  finalize:
    name: 'Finalize Zip and Upload (${{ matrix.architecture }})'
    runs-on: windows-2022
    needs: [sign_installer, package]
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7zip
        run: choco install 7zip -y

      - name: Download Cleaned Archive
        uses: actions/download-artifact@v4
        with:
          name: cleaned_archive-${{ matrix.architecture }}
          path: archive

      - name: Download Signed Installer
        uses: actions/download-artifact@v4
        with:
          name: signed_installer-${{ matrix.architecture }}
          path: .

      - name: Make signed zip
        shell: powershell
        run: ./ci/make_signed_zip.ps1 "${{ env.SL_OBS_VERSION }}" "${{ github.sha }}"

      - name: Rename zip for arm64
        if: matrix.architecture == 'arm64'
        shell: powershell
        run: |
          Rename-Item "slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}-signed.zip" "slplugin-${{ env.SL_OBS_VERSION }}-${{ github.sha }}-arm64-signed.zip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_RELEASE_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_RELEASE_SECRET_ACCESS_KEY}}
          aws-region: us-west-2

      - name: Upload zip to AWS Intermediary
        run: aws s3 cp slplugin-${{env.SL_OBS_VERSION}}-${{ github.sha }}${{ matrix.architecture == 'arm64' && '-arm64' || '' }}-signed.zip s3://${{env.RELEASE_BUCKET}} --acl public-read

      - name: Upload installer to AWS Intermediary
        run: aws s3 cp slplugin-${{env.SL_OBS_VERSION}}-${{ github.sha }}${{ matrix.architecture == 'arm64' && '-arm64' || '' }}-signed.exe s3://${{env.RELEASE_BUCKET}} --acl public-read