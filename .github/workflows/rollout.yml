name: 'Roll Out'

on:
  workflow_dispatch:
    inputs:
      chance_get_new:
        description: 'chance_get_new (0-100)'
        required: true
      new_release_rev:
        description: 'new_release_rev (blank = keep)'
        required: false
        default: ''
      stable_release_rev:
        description: 'stable_release_rev (blank = keep)'
        required: false
        default: ''

env:
  AWS_RELEASE_ACCESS_KEY_ID: ${{secrets.AWS_RELEASE_ACCESS_KEY_ID}}
  AWS_RELEASE_SECRET_ACCESS_KEY: ${{secrets.AWS_RELEASE_SECRET_ACCESS_KEY}}

jobs:
  rollout:
    name: 'Roll Out'
    runs-on: windows-2022
    environment: Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cloudflare CLI
        run: npm install -g cloudflare-cli

      - name: Run rollout script
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_APIKEY }}
          ROLLOUT_CHANCE_GET_NEW: ${{ inputs.chance_get_new }}
          ROLLOUT_NEW_RELEASE_REV: ${{ inputs.new_release_rev }}
          ROLLOUT_STABLE_RELEASE_REV: ${{ inputs.stable_release_rev }}
        run: powershell -File ./ci/rollout.ps1
