name: OBS prebuild

# Builds OBS with no plugin in the tree and publishes the whole tree as a release asset, so
# PR runs restore it instead of spending ~13 minutes rebuilding an OBS they did not change.
#
# Why a release asset rather than actions/cache: a cache written on a PR branch is invisible
# to every other PR, and caches are evicted after 7 days unused. A release asset is shared by
# every branch, never expires, and costs no bandwidth. CI/archive_name.sh owns the name -
# bump ARCHIVE_VERSION there to invalidate.
#
# Why no plugin in the tree: the archive then contains no plugin artifacts at all, so a PR
# run cannot possibly link against a stale plugin DLL - the objects simply do not exist until
# that run compiles them.
#
# The steps are one line each on purpose. The work lives in CI/, so it can be read, reviewed
# and run outside of Actions.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the archive even if it already exists
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - obs.ver
      - CI/archive_name.sh
      - CI/build_obs.ps1
      - .github/workflows/obs-prebuild.yml

permissions:
  contents: write

env:
  RELEASE_TAG: obs-prebuilt

jobs:
  build:
    name: Build and publish
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: obs-sl-browser

      - uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.28.x'

      - name: Is it already published?
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: bash obs-sl-browser/CI/obs_archive.sh exists

      # Cloned at the workspace root so the tree lands on exactly the path tests.yml restores
      # it to. CMakeCache.txt pins absolute paths, so the two have to agree.
      - name: Clone OBS
        if: steps.exists.outputs.skip == 'false'
        run: ./obs-sl-browser/CI/clone_obs.ps1

      - name: Build OBS
        if: steps.exists.outputs.skip == 'false'
        run: ./obs-sl-browser/CI/build_obs.ps1

      - name: Record the toolchain
        if: steps.exists.outputs.skip == 'false'
        run: ./obs-sl-browser/CI/toolchain_manifest.ps1

      - name: Archive
        if: steps.exists.outputs.skip == 'false'
        shell: bash
        run: bash obs-sl-browser/CI/obs_archive.sh create

      - name: Publish
        if: steps.exists.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash obs-sl-browser/CI/obs_archive.sh publish
