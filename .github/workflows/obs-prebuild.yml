name: OBS prebuild

# Builds OBS with no plugin in the tree and publishes the whole tree as a release asset, so
# PR runs restore it instead of spending ~13 minutes rebuilding an OBS they did not change.
#
# Why a release asset rather than actions/cache: a cache written on a PR branch is invisible
# to every other PR, and caches are evicted after 7 days unused. A release asset is shared by
# every branch, never expires, and costs no bandwidth. CI/archive_name.sh owns the name.
#
# Why no plugin in the tree: the archive then contains no plugin artifacts at all, so a PR
# run cannot possibly link against a stale plugin DLL - the objects simply do not exist until
# that run compiles them.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the archive even if it already exists
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - obs.ver
      - CI/archive_name.sh
      - .github/workflows/obs-prebuild.yml

permissions:
  contents: write

env:
  RELEASE_TAG: obs-prebuilt

jobs:
  build:
    name: Build and publish
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: obs-sl-browser

      - uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.28.x'

      - name: Work out the archive name
        id: name
        shell: bash
        run: |
          name=$(bash obs-sl-browser/CI/archive_name.sh)
          echo "archive=$name" >> "$GITHUB_OUTPUT"
          echo "obs_version=$(tr -d '[:space:]' < obs-sl-browser/obs.ver)" >> "$GITHUB_OUTPUT"
          echo "Archive name: $name"

      - name: Skip if it already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=no
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null |
               grep -qx "${{ steps.name.outputs.archive }}"; then
            have=yes
          fi
          if [ "$have" = yes ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.name.outputs.archive }} already published. Re-run with force to rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Cloned at the workspace root so the tree lands on exactly the path tests.yml will
      # restore it to. CMakeCache.txt pins absolute paths, so the two must agree or the
      # restored tree is unusable and CMake fails outright.
      - name: Clone OBS
        if: steps.exists.outputs.skip == 'false'
        run: |
          git clone --recursive --branch ${{ steps.name.outputs.obs_version }} https://github.com/obsproject/obs-studio.git
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }
          Set-Location obs-studio
          git submodule update --init --recursive
          Write-Host "OBS tree at: $pwd"

      # Configured twice on purpose. OBS_PLUGIN_PATH is built from CMAKE_INSTALL_LIBDIR
      # (cmake/windows/defaults.cmake), which is a GNUInstallDirs cache variable and is still
      # empty the first time defaults.cmake runs against a fresh cache. So configure #1 writes
      # "../..//obs-plugins/64bit" into config/obsconfig.h and configure #2 writes
      # "../../lib/obs-plugins/64bit". obsconfig.h is on the include path of all of libobs and
      # obs-frontend-api, so letting a PR run be the second configure would recompile all of
      # OBS. Settling it here means the archive ships the stable value.
      #
      # OBS_VERSION_OVERRIDE pins the other trap: versionconfig.cmake runs
      # `git describe --dirty=-modified` unless the override is set, and grafting the plugin
      # dirties the tree, which flips OBS_VERSION and rebuilds obsversion.c.
      - name: Configure and build OBS
        if: steps.exists.outputs.skip == 'false'
        run: |
          Set-Location obs-studio
          $cfg = @(
              '--preset', 'windows-x64',
              '-DCMAKE_COMPILE_WARNING_AS_ERROR=OFF',
              '-DOBS_VERSION_OVERRIDE=${{ steps.name.outputs.obs_version }}'
          )
          cmake @cfg
          if ($LASTEXITCODE -ne 0) { throw "configure 1 failed" }
          cmake @cfg
          if ($LASTEXITCODE -ne 0) { throw "configure 2 failed" }
          cmake --build --preset windows-x64
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

          if (Test-Path 'build_x64\plugins\obs-sl-browser') {
              throw "the plugin leaked into the OBS-only build tree"
          }

      # Recorded so a PR run can say out loud when the archive was built against a different
      # toolset than the one it is being restored onto - that is the case where the cache
      # quietly stops helping and costs a full rebuild plus a 1.3 GB download.
      - name: Record the toolchain
        if: steps.exists.outputs.skip == 'false'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property catalog_productDisplayVersion
          $sdk = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
                    Sort-Object Name | Select-Object -Last 1).Name
          @{
              obs_version    = '${{ steps.name.outputs.obs_version }}'
              archive        = '${{ steps.name.outputs.archive }}'
              image_os       = $env:ImageOS
              image_version  = $env:ImageVersion
              visual_studio  = $vs
              windows_sdk    = $sdk
              cmake          = (cmake --version | Select-Object -First 1)
              built_at       = (Get-Date -Format 'o')
          } | ConvertTo-Json | Set-Content obs-studio\.prebuild-manifest.json
          Get-Content obs-studio\.prebuild-manifest.json

      # bash, not PowerShell: PowerShell mangles binary through a pipe. .git is dropped
      # because nothing needs it once OBS_VERSION_OVERRIDE is pinned, and the downloaded
      # dependency zips are dropped because .deps is already extracted - but only ever
      # together with an intact CMakeCache.txt, since buildspec_common.cmake decides whether
      # to re-download by looking for the zip rather than the extracted directory.
      - name: Archive
        if: steps.exists.outputs.skip == 'false'
        shell: bash
        run: |
          du -sh obs-studio
          tar -cf - \
            --exclude='obs-studio/.git' \
            --exclude='*/.deps/*.zip' \
            --exclude='obs-studio/build_x86' \
            obs-studio | zstd -T0 -3 -o "${{ steps.name.outputs.archive }}"
          ls -lh "${{ steps.name.outputs.archive }}"

      - name: Publish
        if: steps.exists.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease \
              --title "Prebuilt OBS trees" \
              --notes "Prebuilt OBS build trees for CI. Published by .github/workflows/obs-prebuild.yml; consumed by the e2e job in tests.yml. Not a product release."
          fi
          gh release upload "$RELEASE_TAG" "${{ steps.name.outputs.archive }}" --clobber
          echo "Published ${{ steps.name.outputs.archive }}" >> "$GITHUB_STEP_SUMMARY"
