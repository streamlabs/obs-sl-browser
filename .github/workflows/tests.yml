name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GRPC_VERSION: v1.58.0

jobs:
  # Under a minute, no build. Catches the mistakes that would otherwise cost a fifteen-minute
  # round trip to discover - a test file that does not parse, a suite that does not satisfy
  # the contract, an api call naming a function that is not in JavascriptApi.h.
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/check.mjs

  e2e:
    name: End-to-end
    needs: check
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.28.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Checked out beside the OBS clone rather than at the workspace root, because the
      # plugin has to end up inside obs-studio\plugins to build.
      - uses: actions/checkout@v4
        with:
          path: obs-sl-browser

      - name: Cache gRPC
        uses: actions/cache@v4
        with:
          path: grpc_dist
          key: grpc-${{ env.GRPC_VERSION }}-windows-2022

      - name: Install gRPC
        run: ./obs-sl-browser/ci/install_deps.cmd

      # The same recipe as ci/pipeline.ps1, copied rather than called: that script also
      # writes to S3, pushes symbols and needs release secrets, none of which belong in a
      # test run. Keeping them separate means a change here cannot break the release path.
      - name: Clone OBS and graft the plugin in
        run: |
          $ver = (Get-Content obs-sl-browser\obs.ver -Raw).Trim()
          git clone --recursive --branch $ver https://github.com/obsproject/obs-studio.git
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }
          Set-Location obs-studio
          git submodule update --init --recursive

          $f = '.\plugins\CMakeLists.txt'
          $c = Get-Content $f
          Set-Content $f -Value ($c[0], 'add_subdirectory(obs-sl-browser)', $c[1..($c.Length - 1)])

          Copy-Item -Path '..\obs-sl-browser' -Destination '.\plugins\obs-sl-browser' -Recurse

          $presets = Get-Content .\CMakePresets.json -Raw | ConvertFrom-Json
          foreach ($p in $presets.configurePresets) {
              if ($p.name -ne 'windows-x64') { continue }
              if (-not $p.cacheVariables) { $p | Add-Member -MemberType NoteProperty -Name cacheVariables -Value @{} }
              $p.cacheVariables | Add-Member -MemberType NoteProperty -Name CMAKE_COMPILE_WARNING_AS_ERROR `
                -Value @{ type = 'BOOL'; value = $false } -Force
          }
          $presets | ConvertTo-Json -Depth 100 | Set-Content .\CMakePresets.json

      # About fifteen minutes, all of it OBS rather than the plugin. Worth caching the build
      # tree if that ever becomes the thing people wait on.
      - name: Build
        env:
          Protobuf_DIR: ${{ github.workspace }}\grpc_dist\cmake
          absl_DIR: ${{ github.workspace }}\grpc_dist\lib\cmake\absl
          gRPC_DIR: ${{ github.workspace }}\grpc_dist\lib\cmake\grpc
          utf8_range_DIR: ${{ github.workspace }}\grpc_dist\lib\cmake\utf8_range
        run: |
          Set-Location obs-studio
          cmake --preset windows-x64
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build --preset windows-x64
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Install into the rundir
        run: |
          Set-Location obs-studio
          # Explicit prefix only to keep the default C:\Program Files out of it; rundir is
          # populated from an absolute OBS_OUTPUT_DIR either way. Same step as CI\dev_build.ps1 -Run.
          cmake --install build_x64 --config RelWithDebInfo --prefix "$pwd\build_x64\install"
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          if (-not (Test-Path 'build_x64\rundir\RelWithDebInfo\bin\64bit\obs64.exe')) {
              throw "no obs64.exe in the rundir after install"
          }

      - name: Run the suites
        run: >
          node obs-sl-browser/test/run.mjs
          --obs "$pwd\obs-studio\build_x64\rundir\RelWithDebInfo\bin\64bit\obs64.exe"
          --junit "$pwd\test-results.xml"

      - name: Failure diagnostics
        if: failure()
        run: |
          $logs = "$pwd\obs-studio\build_x64\rundir\RelWithDebInfo\config\obs-studio\logs"
          $log = Get-ChildItem $logs -Filter *.txt -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) { Write-Host '::warning::OBS produced no log.'; exit 0 }
          Write-Host "---- $($log.Name) ----"
          Get-Content $log.FullName -Tail 120

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            test-results.xml
            obs-sl-browser/test/.work/
            obs-studio/build_x64/rundir/RelWithDebInfo/config/obs-studio/logs/
            obs-studio/build_x64/rundir/RelWithDebInfo/config/obs-studio/crashes/
          if-no-files-found: warn
